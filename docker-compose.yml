services:
  db:
    image: postgres:16
    container_name: techleadai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: techleadai
      POSTGRES_PASSWORD: techleadai
      POSTGRES_DB: techleadai
    ports:
      - "5433:5432"
    volumes:
      - techleadai-pgdata:/var/lib/postgresql/data

volumes:
  techleadai-pgdata:
